<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0a1f"/>
      <stop offset="55%" stop-color="#17153b"/>
      <stop offset="100%" stop-color="#0d1630"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c0caf5"/>
      <stop offset="100%" stop-color="#7aa2f7"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbA">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7aa2f7" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
    <style>
      .orb-a { animation: driftA 9s ease-in-out infinite alternate; }
      .orb-b { animation: driftB 11s ease-in-out infinite alternate; }
      .fade  { opacity: 0; animation: fadeUp 1.2s ease-out forwards; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .5s } .d3 { animation-delay: .85s } .d4 { animation-delay: 1.2s }
      .cursor { animation: blink 1s steps(1) infinite; }
      .shine  { animation: sweep 4s ease-in-out infinite; }
      .star   { animation: twinkle 3s ease-in-out infinite; }
      @keyframes driftA { from { transform: translate(0,0) } to { transform: translate(90px,30px) } }
      @keyframes driftB { from { transform: translate(0,0) } to { transform: translate(-80px,-25px) } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }
      @keyframes blink  { 50% { opacity: 0 } }
      @keyframes sweep  { 0% { transform: translateX(-700px) } 100% { transform: translateX(700px) } }
      @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
      .mono { font-family: 'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace; }
      .sans { font-family: 'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <circle class="orb-a" cx="230" cy="80" r="260" fill="url(#orbA)"/>
    <circle class="orb-b" cx="980" cy="230" r="280" fill="url(#orbB)"/>

    <g fill="#c0caf5">
      <circle class="star" cx="120" cy="230" r="1.6" style="animation-delay:.2s"/>
      <circle class="star" cx="310" cy="40"  r="1.2" style="animation-delay:1.1s"/>
      <circle class="star" cx="470" cy="260" r="1.4" style="animation-delay:.6s"/>
      <circle class="star" cx="760" cy="35"  r="1.6" style="animation-delay:1.8s"/>
      <circle class="star" cx="900" cy="75"  r="1.2" style="animation-delay:.9s"/>
      <circle class="star" cx="1090" cy="50" r="1.5" style="animation-delay:2.2s"/>
      <circle class="star" cx="1120" cy="250" r="1.2" style="animation-delay:1.4s"/>
      <circle class="star" cx="60"  cy="70"  r="1.3" style="animation-delay:2.6s"/>
    </g>

    <!-- terminal prompt -->
    <g class="fade d1">
      <text x="600" y="78" text-anchor="middle" class="mono" font-size="17" fill="#9ece6a">
        syn@github<tspan fill="#565f89">:</tspan><tspan fill="#7aa2f7">~</tspan><tspan fill="#565f89">$</tspan><tspan fill="#c0caf5"> whoami</tspan><tspan class="cursor" fill="#bb9af7"> ▍</tspan>
      </text>
    </g>

    <!-- name -->
    <g class="fade d2">
      <text x="600" y="160" text-anchor="middle" class="sans" font-size="78" font-weight="800" letter-spacing="10" fill="url(#name)">MURAT EREN</text>
    </g>

    <!-- divider with shine -->
    <g class="fade d3">
      <rect x="380" y="186" width="440" height="2" rx="1" fill="url(#line)"/>
      <g clip-path="url(#frame)">
        <rect class="shine" x="560" y="185" width="80" height="4" rx="2" fill="#ffffff" opacity="0.5"/>
      </g>
    </g>

    <!-- role -->
    <g class="fade d3">
      <text x="600" y="226" text-anchor="middle" class="sans" font-size="21" font-weight="500" letter-spacing="3" fill="#a9b1d6">FULL-STACK DEVELOPER  ·  GAME-SERVER SECURITY</text>
    </g>

    <!-- stack line -->
    <g class="fade d4">
      <text x="600" y="262" text-anchor="middle" class="mono" font-size="15" fill="#565f89">ASP.NET Core  /  Next.js  /  PostgreSQL  /  Lua</text>
    </g>

    <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#7aa2f7" stroke-opacity="0.25" stroke-width="2"/>
  </g>
</svg>
